# Agentmaster CLA gate.
# Blocks a PR from merging until its author has signed CLA.md (the outbound-relicensing
# grant that backs the commercial license). See CLA.md / LICENSE-COMMERCIAL.md.
#
# Before this actually gates:
#   1. Create the unprotected `cla-signatures` branch (signatures are committed THERE,
#      not onto the protected default branch):
#        git switch --orphan cla-signatures && git commit --allow-empty -m init && git push -u origin cla-signatures
#   2. Repo Settings -> Secrets and variables -> Actions -> Variables: add CLA_ENABLED = true
#      to arm the gate. Until then the step is skipped — a parse-safe dormancy switch
#      (`vars` IS valid in `if:`; `secrets` is NOT — referencing secrets in `if:` is a hard
#      parse error that would fail every PR, which is why we don't gate on the PAT here).
#   3. Settings -> Branches: make the "CLA Assistant" status check REQUIRED on `agentmaster`
#      (otherwise a failing check does not actually block merge).
#
# The action was archived (read-only) on 2026-03-23; last release v2.6.1. It still runs.
# Pinned to its immutable commit SHA (best practice under pull_request_target, which grants
# secrets + PR write).
#
# Alternative (keep signature commits OUT of this repo): create a separate private repo
# `Nucs/agentmaster-cla-signatures`, mint a PAT (repo scope) and add it as
# PERSONAL_ACCESS_TOKEN here, then set `permissions: contents: read`, add a JOB-LEVEL
# `env: { HAS_PAT: "${{ secrets.PERSONAL_ACCESS_TOKEN != '' }}" }`, gate the step on
# `env.HAS_PAT == 'true'`, pass `PERSONAL_ACCESS_TOKEN` in the step env, and set
# `branch: 'main'` + `remote-organization-name: Nucs` + `remote-repository-name: agentmaster-cla-signatures`.

name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write          # commit the signature file to the cla-signatures branch
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: "CLA Assistant"
        if: >-
          vars.CLA_ENABLED == 'true' &&
          (
            github.event_name == 'pull_request_target' ||
            github.event.comment.body == 'recheck' ||
            github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
          )
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08  # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/version1/cla.json'
          path-to-document: 'https://github.com/Nucs/Agentmaster/blob/agentmaster/CLA.md'
          branch: 'cla-signatures'
          allowlist: 'dependabot[bot],github-actions[bot]'
          lock-pullrequest-aftermerge: false
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-notsigned-prcomment: 'Thanks for your PR! Before we can merge it, please sign the [Contributor License Agreement](https://github.com/Nucs/Agentmaster/blob/agentmaster/CLA.md) by commenting on this PR with the exact line above.'
