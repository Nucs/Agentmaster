# Agentmaster — GitHub release build.
#
# A fork-friendly port of Windows Terminal's Azure-Pipelines "full release build"
# (build/pipelines/ob-release.yml -> pipeline-onebranch-full-release-build.yml),
# stripped of everything Microsoft-internal:
#   - NO Azure / OneBranch / 1ES, NO ESRP signing, NO symbol-SERVER publishing (upstream pushes to MSDL; this
#     fork ships its symbols as release assets instead - see "Produces" and doc/agentmaster/SYMBOLS.md), NO vpack
#   - NO scheduled cron (tag/dispatch only), NO NuGet *publishing* (restore stays — it's a build dep).
#     A NIGHTLY release is still cut by tag/dispatch: tag it vX.Y.Z-prerelease-nightly (any tag
#     containing "nightly") — prep strips the suffix for the numeric MSIX Identity Version and the
#     release is auto-marked PRERELEASE. The in-app updater (Updater.h IsNightlyTag) matches the
#     TAG's "nightly" and offers such a release ONLY to users who opted into nightly builds.
#   - the Microsoft-internal "terminal-internal" Universal Package + WindowsTerminalOfficialBuild
#     are NOT used; we build the Dev BRANDING with the RELEASE package identity
#     (/p:AgentmasterPackageIdentity=Release -> Package-Rel.appxmanifest, Name=Agentmaster,
#     alias agentmaster.exe). The local dev loose layout uses the DEV identity
#     (Package-Dev.appxmanifest, Name=AgentmasterDev, alias agentmasterdev.exe), so the
#     released app installs SIDE BY SIDE with a dev build — different package family,
#     Start-menu entry, alias, single-instance identity, and (via the first-launch profile
#     picker) state profile. See doc/agentmaster/PROFILES.md.
#
# Produces, attached to a GitHub Release:
#   - Agentmaster_<ver>.msixbundle   (x64+arm64; SELF-SIGNED — see the .cer caveat below)
#   - Agentmaster.cer                (public cert; import to Trusted People to install the bundle)
#   - Agentmaster_<ver>_x64.zip      (TRUE portable: one agentmaster-<ver> folder shipping the
#     .portable marker, an .am-version stamp and the .am-manifest (the top-level names this build
#     ships: updates and uninstalls remove ONLY these, so a user's own files in the folder stay; a
#     zip without it cannot be installed for all users) — first launch asks where Agentmaster
#     should live (just for you / for all users / here / keep it portable / later; PROFILES.md
#     §2b), the in-app updater self-updates it IN PLACE via this very zip asset; unzip & run, no
#     install/cert needed). Beside every binary it also carries that binary's PUBLIC PDB (function
#     names + addresses, written by the same link with /PDBSTRIPPED), listed in .am-manifest like
#     every shipped file, so a stack trace from any install names every function.
#   - Agentmaster_<ver>_arm64.zip    (portable)
#   - Agentmaster_<ver>_x64_symbols.zip / _arm64_symbols.zip  (the FULL PDB of every binary we
#     build - types, line numbers, locals - flat, extractable into an install folder over the public
#     ones; Source-Linked AND srcsrv-indexed to this commit, so Visual Studio / WinDbg / cdb download
#     each source file from GitHub. Agentmaster is open source: nothing in them is private.)
#     Asset names matter: the in-app updater picks *_x64.zip / *_arm64.zip / *.msixbundle / *.cer
#     by suffix (Updater.h ParseReleaseObj) and Install-Agentmaster.ps1 by "_<arch>\.zip$" - a
#     "_symbols.zip" name matches none of them, in this build or any build already installed.
#
# Heads-up (things a runner may need that this box has natively):
#   * windows-2022 must have the VS2022 "Desktop development with C++" AND
#     "Universal Windows Platform development" workloads + a recent Windows SDK
#     (10.0.22621 / 26100). If the CascadiaPackage (.wapproj) build fails to find the
#     UWP packaging targets, add a workload-install step (slow) or pin a known-good image.
#   * vcpkg builds native deps from source on a cold cache (the long pole). Cached below.
#
# SIGNING: the manifest Publisher is "CN=Agentmaster" (package family Agentmaster_56k4f06dsfp9r —
# the hash derives from the Publisher ALONE, which the dev identity shares: it is
# AgentmasterDev_56k4f06dsfp9r). An MSIX signature is only valid when the signing cert's subject
# is byte-identical to that Publisher, so this workflow mints a self-signed "CN=Agentmaster"
# cert — its subject is read from the manifest at runtime, so it always matches. Being
# self-signed, users must import Agentmaster.cer to install the bundle; the portable ZIP needs
# no cert at all. To use a real cert instead, set repo secrets SIGNING_PFX_BASE64 +
# SIGNING_PFX_PASSWORD (its subject must still equal the manifest Publisher).

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version X.Y.Z (no leading v; a -suffix is kept in the tag — e.g. 0.6.10-prerelease-nightly cuts a NIGHTLY)"
        required: true
        default: "0.1.0"

permissions:
  contents: write # create the GitHub Release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CONFIGURATION: Release
  # The RELEASE-identity manifest (Name=Agentmaster). Package-Dev.appxmanifest is the local
  # dev loose layout's AgentmasterDev identity and must NEVER ship from here.
  MANIFEST: src/cascadia/CascadiaPackage/Package-Rel.appxmanifest

jobs:
  # ----------------------------------------------------------------------------
  prep:
    runs-on: ubuntu-latest
    outputs:
      ver3: ${{ steps.v.outputs.ver3 }}
      ver4: ${{ steps.v.outputs.ver4 }}
      rawver: ${{ steps.v.outputs.rawver }}
      nightly: ${{ steps.v.outputs.nightly }}
    steps:
      - id: v
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW="${{ github.event.inputs.version }}"
          else
            RAW="${GITHUB_REF_NAME#v}"
          fi
          # Keep the first three numeric components; force a 4-part .0 for the manifest. Each
          # component is stripped to its leading digits: a suffixed tag (v0.6.10-prerelease-nightly,
          # v0.7.0-rc1) must stamp a purely-NUMERIC MSIX Identity Version (0.6.10.0) — the third
          # IFS field would otherwise carry "10-prerelease-nightly" and break the manifest. The
          # FULL version string (rawver) still names the tag + release, which is what the in-app
          # updater matches "nightly" against (Updater.h IsNightlyTag — tag contains "nightly").
          IFS='.' read -r A B C _ <<< "$RAW"
          A=$(printf '%s' "${A:-0}" | sed 's/[^0-9].*$//'); A=${A:-0}
          B=$(printf '%s' "${B:-0}" | sed 's/[^0-9].*$//'); B=${B:-0}
          C=$(printf '%s' "${C:-0}" | sed 's/[^0-9].*$//'); C=${C:-0}
          NIGHTLY=false
          case "$(printf '%s' "$RAW" | tr '[:upper:]' '[:lower:]')" in *nightly*) NIGHTLY=true ;; esac
          echo "rawver=${RAW}"         >> "$GITHUB_OUTPUT"
          echo "ver3=${A}.${B}.${C}"   >> "$GITHUB_OUTPUT"
          echo "ver4=${A}.${B}.${C}.0" >> "$GITHUB_OUTPUT"
          echo "nightly=${NIGHTLY}"    >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${A}.${B}.${C}.0 (from '${RAW}', nightly=${NIGHTLY})"

  # ----------------------------------------------------------------------------
  build:
    needs: prep
    runs-on: windows-2022
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: x64, platform: x64, xamlarch: x64 }
          - { name: arm64, platform: ARM64, xamlarch: arm64 }
    env:
      VER4: ${{ needs.prep.outputs.ver4 }}
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg_cache
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: microsoft/setup-msbuild@v2

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.config', '**/*.vcxproj', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: vcpkg_cache
          key: vcpkg-${{ runner.os }}-${{ matrix.platform }}-${{ hashFiles('vcpkg.json', 'dep/vcpkg-overlay-ports/**') }}
          restore-keys: vcpkg-${{ runner.os }}-${{ matrix.platform }}-

      - name: Stamp version into the manifest
        shell: pwsh
        run: |
          [xml]$x = Get-Content $env:MANIFEST
          $x.Package.Identity.Version = $env:VER4
          $x.Save((Resolve-Path $env:MANIFEST))
          Write-Host "Identity Version -> $($x.Package.Identity.Version)"

      - name: Detect / bootstrap vcpkg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          $vs = & 'C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe' -requires Microsoft.VisualStudio.Component.Vcpkg -property installationPath
          if ([string]::IsNullOrEmpty($vs)) {
            if ($env:VCPKG_INSTALLATION_ROOT -and (Test-Path $env:VCPKG_INSTALLATION_ROOT)) {
              $root = $env:VCPKG_INSTALLATION_ROOT     # GitHub-hosted runners ship vcpkg here
            } else {
              Remove-Item -Recurse -Force dep/vcpkg -ErrorAction Ignore
              git clone https://github.com/microsoft/vcpkg dep/vcpkg
              & ./dep/vcpkg/bootstrap-vcpkg.bat
              $root = (Resolve-Path dep/vcpkg).Path
            }
          } else {
            $root = Join-Path $vs 'VC\vcpkg'
          }
          Write-Host "VCPKG_ROOT=$root"
          "VCPKG_ROOT=$root" >> $env:GITHUB_ENV

      # Agentmaster: the session database service (agentmaster-sessiondb.exe, shipped with duckdb.dll in the package
      # root) links the pinned DuckDB C library, which is not in the repository (doc/agentmaster/SESSIONS_DB.md
      # section 3.4). The script checks the archive's SHA-256 against its pin; the matrix name is its arch.
      - name: Cache libduckdb
        uses: actions/cache@v4
        with:
          path: dep/duckdb
          key: duckdb-${{ runner.os }}-${{ matrix.name }}-${{ hashFiles('tools/Get-DuckDb.ps1') }}

      - name: Fetch libduckdb
        shell: pwsh
        run: pwsh -NoProfile -File tools/Get-DuckDb.ps1 -Arch ${{ matrix.name }}

      - name: Restore (NuGet + solution)
        shell: pwsh
        run: |
          # dep/nuget package set (the bundled nuget.exe can't parse .slnx, so restore the
          # packages.config directly — mirrors tools/Build-Agentmaster.ps1).
          & dep\nuget\nuget.exe restore dep\nuget\packages.config -PackagesDirectory packages
          if (Test-Path build\packages.config) {
            & dep\nuget\nuget.exe restore build\packages.config -PackagesDirectory packages
          }
          # PackageReference + project restore for the solution.
          msbuild OpenConsole.slnx /t:Restore /m /p:Configuration=$env:CONFIGURATION /p:Platform=${{ matrix.platform }}

      - name: Generate NOTICE.html
        shell: pwsh
        run: .\build\scripts\Generate-ThirdPartyNotices.ps1 -MarkdownNoticePath .\NOTICE.md -OutputPath .\src\cascadia\CascadiaPackage\NOTICE.html

      # Agentmaster: RELEASE SYMBOLS (doc/agentmaster/SYMBOLS.md). Two inputs of the build below:
      #   * the Source Link map every module PDB embeds (link /SOURCELINK): this commit's raw.githubusercontent.com
      #     files, and each GitHub submodule's at its own pin - written by tools\New-AgentmasterSourceLink.ps1;
      #   * the folder the link writes each binary's PUBLIC PDB into (link /PDBSTRIPPED), later placed beside the
      #     binaries in the portable zip. No trailing backslash on it: "\" before the closing quote of an msbuild
      #     /p: argument would escape the quote (src\common.build.post.props adds the separator itself).
      - name: Prepare the release symbols (Source Link map + public PDB folder)
        shell: pwsh
        run: |
          $map = Join-Path $env:RUNNER_TEMP 'agentmaster-sourcelink.json'
          $pub = Join-Path $env:RUNNER_TEMP 'agentmaster-public-pdbs'
          .\tools\New-AgentmasterSourceLink.ps1 -RepoRoot $env:GITHUB_WORKSPACE -Repository $env:GITHUB_REPOSITORY `
            -Commit $env:GITHUB_SHA -OutFile $map
          New-Item -ItemType Directory -Force $pub | Out-Null
          "AM_SOURCELINK=$map"  >> $env:GITHUB_ENV
          "AM_PUBLIC_PDBS=$pub" >> $env:GITHUB_ENV

      # Agentmaster: the two symbol properties (the step above) switch on link /SOURCELINK and /PDBSTRIPPED for every
      # .exe / .dll (src\common.build.post.props). AppxSymbolPackageEnabled=false skips DesktopBridge's own .appxsym:
      # an UNINDEXED zip of the same full PDBs that this workflow always built and threw away; the release ships its
      # own source-indexed Agentmaster_<ver>_<arch>_symbols.zip instead (below).
      - name: Build CascadiaPackage (Release, Dev branding + RELEASE package identity)
        shell: pwsh
        run: |
          msbuild OpenConsole.slnx /m `
            /p:Configuration=$env:CONFIGURATION `
            /p:Platform=${{ matrix.platform }} `
            /p:WindowsTerminalBranding=Dev `
            /p:AgentmasterPackageIdentity=Release `
            /p:AppxPackageSigningEnabled=false `
            "/p:AgentmasterSourceLinkFile=$env:AM_SOURCELINK" `
            "/p:AgentmasterPublicPdbDir=$env:AM_PUBLIC_PDBS" `
            /p:AppxSymbolPackageEnabled=false `
            /t:Terminal\CascadiaPackage `
            /bl:msbuild-${{ matrix.name }}.binlog

      - name: Locate the MSIX + resolve the SDK
        id: loc
        shell: pwsh
        run: |
          $msix = Get-ChildItem -Recurse -Filter 'CascadiaPackage*.msix' |
                  Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $msix) { throw "No CascadiaPackage*.msix produced" }
          $kit = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Directory |
                 Where-Object { Test-Path (Join-Path $_.FullName 'x64\makeappx.exe') } |
                 Sort-Object Name -Descending | Select-Object -First 1
          "msix=$($msix.FullName)"                          >> $env:GITHUB_OUTPUT
          "makeappx=$(Join-Path $kit.FullName 'x64\makeappx.exe')" >> $env:GITHUB_OUTPUT
          Write-Host "MSIX: $($msix.FullName)"

      - name: Sanity-check the MSIX
        shell: pwsh
        continue-on-error: true
        run: .\build\scripts\Test-WindowsTerminalPackage.ps1 -Verbose -Path "${{ steps.loc.outputs.msix }}"

      # Agentmaster: source-index the FULL PDBs of the package layout (the PDBs beside the binaries the .msix was made
      # from) with upstream's build\scripts\Index-Pdbs.ps1: a "srcsrv" stream mapping every git-tracked source file to
      # raw.githubusercontent.com at this commit, for cdb / classic WinDbg (Visual Studio and WinDbg read the Source
      # Link map the link already embedded). pdbstr / srctool come from build\packages.config (restored above). GUID
      # and age are untouched, so the PDBs still match the binaries. The indexer prints every source file of every
      # PDB: that goes to a log (uploaded with the binlog); Export-AgentmasterSymbols.ps1 below checks the result.
      - name: Source-index the full PDBs (srcsrv)
        shell: pwsh
        run: |
          $layout = "src\cascadia\CascadiaPackage\bin\${{ matrix.platform }}\$env:CONFIGURATION"
          if (-not (Test-Path "$layout\AppxManifest.xml")) { throw "no package layout at $layout" }
          foreach ($tool in 'Microsoft.Debugging.Tools.PdbStr', 'Microsoft.Debugging.Tools.SrcTool') {
            if (-not (Get-ChildItem packages -Directory -Filter "$tool.*" -ErrorAction Ignore)) {
              throw "$tool was not restored (build\packages.config): the PDBs cannot be source-indexed"
            }
          }
          # Beside the binlog (the workspace root), so the binlog artifact keeps both at its top level.
          $log = Join-Path $env:GITHUB_WORKSPACE "index-pdbs-${{ matrix.name }}.log"
          .\build\scripts\Index-Pdbs.ps1 -SearchDir $layout -SourceRoot $env:GITHUB_WORKSPACE -CommitId $env:GITHUB_SHA `
            -Organization $env:GITHUB_REPOSITORY_OWNER -Repo "${{ github.event.repository.name }}" *> $log
          Write-Host "Index-Pdbs.ps1: $((Get-Content $log).Count) log lines -> $log"
          "AM_LAYOUT=$layout" >> $env:GITHUB_ENV

      # Agentmaster: Agentmaster_<ver>_<arch>_symbols.zip = the FULL PDB of every binary we built, matched to it by GUID +
      # age (tools\Export-AgentmasterSymbols.ps1). The step fails unless every one is found and carries BOTH indexes
      # naming this commit: a release never ships an unindexed, stale or missing PDB.
      - name: Package the full symbols
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force _symbols | Out-Null
          .\tools\Export-AgentmasterSymbols.ps1 -BinaryFolder $env:AM_LAYOUT -PdbSearchPath $env:AM_LAYOUT `
            -RequireUnder $env:GITHUB_WORKSPACE -RequireSourceLink $env:GITHUB_SHA -RequireSourceServer `
            -ZipTo "_symbols\Agentmaster_${env:VER4}_${{ matrix.name }}_symbols.zip"

      - name: Build portable (unpackaged) distribution
        shell: pwsh
        run: |
          $xaml = Get-ChildItem -Recurse -Path src\cascadia\CascadiaPackage\AppPackages -Filter 'Microsoft.UI.Xaml*.appx' |
                  Where-Object { $_.FullName -match "\\Dependencies\\${{ matrix.xamlarch }}\\" } |
                  Select-Object -First 1
          if (-not $xaml) { throw "No Microsoft.UI.Xaml appx for ${{ matrix.xamlarch }}" }
          New-Item -ItemType Directory -Force _unpackaged | Out-Null
          # -PortableMode: ship the .portable marker + the .am-version stamp, so the zip is a
          # TRUE portable — its first launch asks which profile to use (default: the
          # self-contained <unzip>\profile, remembered in <unzip>\profile.path; PROFILES.md §2a)
          # and the in-app updater self-updates it IN PLACE from this zip asset (Updater.h
          # -Portable). Without the marker the zip would share the global unpackaged settings
          # dir with any other unpackaged Terminal.
          # -SymbolsPath / -RequireSymbolsUnder (Agentmaster, doc/agentmaster/SYMBOLS.md): the PUBLIC PDB the link
          # wrote for each binary goes beside it, before .am-manifest is written; a binary we built without one
          # stops the step (no zip is made).
          .\build\scripts\New-UnpackagedTerminalDistribution.ps1 `
            -TerminalAppX "${{ steps.loc.outputs.msix }}" `
            -XamlAppX $xaml.FullName `
            -Destination _unpackaged `
            -MakeAppxPath "${{ steps.loc.outputs.makeappx }}" `
            -PortableMode:$true `
            -SymbolsPath $env:AM_PUBLIC_PDBS `
            -RequireSymbolsUnder $env:GITHUB_WORKSPACE

      - name: Stage the per-arch MSIX for bundling
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force _msix | Out-Null
          Copy-Item "${{ steps.loc.outputs.msix }}" _msix\

      - uses: actions/upload-artifact@v4
        with:
          name: msix-${{ matrix.name }}
          path: _msix/*.msix
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: portable-${{ matrix.name }}
          path: _unpackaged/*.zip
          if-no-files-found: error

      # Agentmaster: the full symbols zip (already deflated: stored as is, compression would only cost time).
      - uses: actions/upload-artifact@v4
        with:
          name: symbols-${{ matrix.name }}
          path: _symbols/*.zip
          if-no-files-found: error
          compression-level: 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: binlog-${{ matrix.name }}
          # + the srcsrv indexer's log (Agentmaster): which source files of which PDB it mapped, for a failed check.
          path: |
            msbuild-${{ matrix.name }}.binlog
            index-pdbs-${{ matrix.name }}.log
          if-no-files-found: warn

  # ----------------------------------------------------------------------------
  bundle:
    needs: [prep, build]
    runs-on: windows-2022
    env:
      VER4: ${{ needs.prep.outputs.ver4 }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Download all per-arch MSIX
        uses: actions/download-artifact@v4
        with:
          pattern: msix-*
          path: msix-in
          merge-multiple: true

      - name: Create the multi-arch msixbundle
        id: pack
        shell: pwsh
        run: |
          $kit = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Directory |
                 Where-Object { Test-Path (Join-Path $_.FullName 'x64\makeappx.exe') } |
                 Sort-Object Name -Descending | Select-Object -First 1
          $makeappx = Join-Path $kit.FullName 'x64\makeappx.exe'
          New-Item -ItemType Directory -Force out | Out-Null
          $bundle = "out\Agentmaster_${env:VER4}.msixbundle"
          .\build\scripts\Create-AppxBundle.ps1 `
            -ProjectName CascadiaPackage `
            -BundleVersion $env:VER4 `
            -InputPath msix-in `
            -OutputPath $bundle `
            -MakeAppxPath $makeappx
          "bundle=$bundle"   >> $env:GITHUB_OUTPUT
          "signtool=$(Join-Path $kit.FullName 'x64\signtool.exe')" >> $env:GITHUB_OUTPUT

      - name: Self-sign the bundle (or use a provided cert) + export public .cer
        shell: pwsh
        env:
          SIGNING_PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
        run: |
          # The cert subject MUST equal the manifest Publisher or the signature is invalid.
          [xml]$x = Get-Content $env:MANIFEST
          $publisher = $x.Package.Identity.Publisher
          Write-Host "Publisher (cert subject): $publisher"

          if ($env:SIGNING_PFX_BASE64) {
            [IO.File]::WriteAllBytes("$PWD\sign.pfx", [Convert]::FromBase64String($env:SIGNING_PFX_BASE64))
            $sec  = ConvertTo-SecureString $env:SIGNING_PFX_PASSWORD -AsPlainText -Force
            $cert = Import-PfxCertificate -FilePath sign.pfx -CertStoreLocation Cert:\CurrentUser\My -Password $sec
            Write-Host "Using provided signing certificate."
          } else {
            $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject $publisher `
                      -CertStoreLocation Cert:\CurrentUser\My -FriendlyName "Agentmaster (self-signed)" `
                      -KeyExportPolicy Exportable -NotAfter (Get-Date).AddYears(5)
            Write-Host "Minted an ephemeral self-signed certificate."
          }

          & "${{ steps.pack.outputs.signtool }}" sign /fd SHA256 /sha1 $cert.Thumbprint "${{ steps.pack.outputs.bundle }}"
          if ($LASTEXITCODE -ne 0) { throw "signtool failed ($LASTEXITCODE)" }

          Export-Certificate -Cert (Get-Item "Cert:\CurrentUser\My\$($cert.Thumbprint)") `
            -FilePath "out\Agentmaster.cer" | Out-Null

      - uses: actions/upload-artifact@v4
        with:
          name: bundle
          path: |
            out/*.msixbundle
            out/*.cer
          if-no-files-found: error

  # ----------------------------------------------------------------------------
  release:
    needs: [prep, build, bundle]
    runs-on: ubuntu-latest
    steps:
      # symbols-* (Agentmaster): the full symbols zips; "dist/*.zip" below attaches them with the portable zips.
      - name: Download all release assets
        uses: actions/download-artifact@v4
        with:
          pattern: "{bundle,portable-*,symbols-*}"
          path: dist
          merge-multiple: true

      - name: List assets
        run: ls -R dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Agentmaster ${{ needs.prep.outputs.rawver }}
          # A dispatch tags the FULL raw version (v0.6.10-prerelease-nightly cuts a nightly tag);
          # for a plain X.Y.Z input this is byte-identical to the old v<ver3> behavior.
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', needs.prep.outputs.rawver) || github.ref_name }}
          draft: true # flip to false once you've confirmed a run; lets you review assets first
          # A "nightly"-named version is ALWAYS a GitHub prerelease (the naming contract the in-app
          # updater keys on: nightlies never surface on the stable channel, and only reach users who
          # opted into nightly builds — Updater.h IsNightlyTag/ReleaseAllowedOnChannel).
          prerelease: ${{ needs.prep.outputs.nightly == 'true' }}
          files: |
            dist/*.msixbundle
            dist/*.cer
            dist/*.zip
          body: |
            ## Agentmaster ${{ needs.prep.outputs.rawver }}

            ${{ needs.prep.outputs.nightly == 'true' && '> ⚠️ **NIGHTLY build** — an unstable development version. It may have memory leaks, CPU issues, and crashes. Install it only to help test; the in-app updater offers nightlies solely to users who enabled them in Settings → About → Updates.' || '' }}

            A fork of Windows Terminal that manages multiple Claude Code sessions.

            ### Install
            Paste into PowerShell — installs **v${{ needs.prep.outputs.rawver }}** (administrator rights not needed). It asks where Agentmaster should live: **[1] Just for you** (the default — no administrator rights, now or for any update), **[2] For all users of this PC** (one administrator approval, only for that step), or **[3] As the app package** (MSIX — an administrator trusts this release's certificate once):
            ```powershell
            & ([scriptblock]::Create((irm https://raw.githubusercontent.com/Nucs/Agentmaster/agentmaster/tools/Install-Agentmaster.ps1))) -Version ${{ needs.prep.outputs.rawver }}
            ```
            Add `-Scope User` (or `Machine` / `Package`) to skip the question, and/or `-Launch` to start it right after:
            ```powershell
            & ([scriptblock]::Create((irm https://raw.githubusercontent.com/Nucs/Agentmaster/agentmaster/tools/Install-Agentmaster.ps1))) -Version ${{ needs.prep.outputs.rawver }} -Scope User -Launch
            ```
            Run by an administrator from another account, or as SYSTEM, it installs for the user signed in to Windows and starts Agentmaster as them (`-ForCurrentAccount` installs for the running account instead). Unattended runs: add PowerShell's `-NonInteractive`.

            **Portable zip (recommended, no certificate):** download `Agentmaster_${{ needs.prep.outputs.ver4 }}_x64.zip` (or `_arm64`), unzip anywhere, run `Agentmaster.exe` inside the `agentmaster-${{ needs.prep.outputs.ver4 }}` folder (a `WindowsTerminal.exe` compat shim next to it works too). First launch asks where Agentmaster should live: **Enter installs it just for you** (`%USERPROFILE%\.agentmaster\bin` — a desktop icon, a Start-menu entry, an "Open in Agentmaster" folder right-click entry and an Apps & Features entry with Uninstall; no administrator rights, no package), or **for all users of this PC** (one administrator approval), or — when another account runs it — **sets it up for the user signed in to Windows**; or pick a folder, install it right there, keep it portable (self-contained), or decide later. Either way it self-updates in place from then on.

            **MSIX bundle (self-signed):**
            1. Download `Agentmaster.cer` + `Agentmaster_${{ needs.prep.outputs.ver4 }}.msixbundle`.
            2. Trust this release's certificate (admin PowerShell; every release has its own):
               `Import-Certificate -FilePath Agentmaster.cer -CertStoreLocation Cert:\LocalMachine\TrustedPeople`
            3. `Add-AppxPackage .\Agentmaster_${{ needs.prep.outputs.ver4 }}.msixbundle` (or double-click it).

            Installed, it runs as **`agentmaster`** (execution alias) / Start-menu **Agentmaster**.

            ### Debugging symbols
            Agentmaster is open source, so every release ships the symbols of every binary it builds:
            - **In the portable zips**, a *public* PDB sits beside each binary: a stack trace or crash dump from any install names every function.
            - **`Agentmaster_${{ needs.prep.outputs.ver4 }}_x64_symbols.zip`** (or `_arm64`) holds the *full* PDBs: types, line numbers, local variables. They are Source-Linked to this release's commit, so Visual Studio and WinDbg download each source file from GitHub as you debug. Extract the zip into the folder that holds `Agentmaster.exe` (it replaces the public PDBs; the next update brings public ones again), or anywhere on your debugger's symbol path - the way for an MSIX install, whose folder is read-only.

            ### Profiles & coexistence with a dev build
            Agentmaster keeps *everything* it persists (sessions, prompt queues, window layouts,
            settings — including Terminal's own settings) in one **profile folder**, picked
            automatically on first launch: `%USERPROFILE%\.agentmaster` (a portable copy asks). Change
            it later from the Agent Manager page (the Home button) → ⚙ → Profile. This release
            coexists with a locally built **Agentmaster Dev** (`AgentmasterDev` package,
            `agentmasterdev` alias, `%USERPROFILE%\.agentmaster-dev`) without sharing any state.
