# Agentmaster — CI build gate (no release).
#
# A build-only PR gate: it compiles + links the app (Terminal\CascadiaPackage, x64 Release) so a
# pull request can't merge code that doesn't build. It does NOT package, sign, version-stamp, or
# release anything — that is release.yml's job (tag/dispatch only). Release config here mirrors the
# release build, so a green CI strongly predicts a green release: that includes the release SYMBOLS
# (doc/agentmaster/SYMBOLS.md) - the same /SOURCELINK + /PDBSTRIPPED links, the same srcsrv indexing,
# and the same checks that every binary we build has its full, indexed PDB and its public PDB
# (nothing is uploaded).
#
# Same runner caveat as release.yml: windows-2022 must carry the VS2022 "Desktop development with
# C++" + "Universal Windows Platform development" workloads and a recent Windows SDK; vcpkg builds
# native deps from source on a cold cache (cached below).

name: ci

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [agentmaster, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true # a newer push supersedes an in-flight gate

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg_cache
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: microsoft/setup-msbuild@v2

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.config', '**/*.vcxproj', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: vcpkg_cache
          key: vcpkg-${{ runner.os }}-x64-${{ hashFiles('vcpkg.json', 'dep/vcpkg-overlay-ports/**') }}
          restore-keys: vcpkg-${{ runner.os }}-x64-

      - name: Detect / bootstrap vcpkg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          $vs = & 'C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe' -requires Microsoft.VisualStudio.Component.Vcpkg -property installationPath
          if ([string]::IsNullOrEmpty($vs)) {
            if ($env:VCPKG_INSTALLATION_ROOT -and (Test-Path $env:VCPKG_INSTALLATION_ROOT)) {
              $root = $env:VCPKG_INSTALLATION_ROOT
            } else {
              Remove-Item -Recurse -Force dep/vcpkg -ErrorAction Ignore
              git clone https://github.com/microsoft/vcpkg dep/vcpkg
              & ./dep/vcpkg/bootstrap-vcpkg.bat
              $root = (Resolve-Path dep/vcpkg).Path
            }
          } else {
            $root = Join-Path $vs 'VC\vcpkg'
          }
          Write-Host "VCPKG_ROOT=$root"
          "VCPKG_ROOT=$root" >> $env:GITHUB_ENV

      # Agentmaster: the session database service links the pinned DuckDB C library, which is not in the repository
      # (doc/agentmaster/SESSIONS_DB.md section 3.4). The script checks the archive's SHA-256 against its pin.
      - name: Cache libduckdb
        uses: actions/cache@v4
        with:
          path: dep/duckdb
          key: duckdb-${{ runner.os }}-x64-${{ hashFiles('tools/Get-DuckDb.ps1') }}

      - name: Fetch libduckdb (x64)
        shell: pwsh
        run: pwsh -NoProfile -File tools/Get-DuckDb.ps1 -Arch x64

      - name: Restore (NuGet + solution)
        shell: pwsh
        run: |
          & dep\nuget\nuget.exe restore dep\nuget\packages.config -PackagesDirectory packages
          if (Test-Path build\packages.config) {
            & dep\nuget\nuget.exe restore build\packages.config -PackagesDirectory packages
          }
          msbuild OpenConsole.slnx /t:Restore /m /p:Configuration=Release /p:Platform=x64

      # Agentmaster: the release symbols' inputs, exactly as release.yml makes them (see the comments there).
      - name: Prepare the release symbols (Source Link map + public PDB folder)
        shell: pwsh
        run: |
          $map = Join-Path $env:RUNNER_TEMP 'agentmaster-sourcelink.json'
          $pub = Join-Path $env:RUNNER_TEMP 'agentmaster-public-pdbs'
          .\tools\New-AgentmasterSourceLink.ps1 -RepoRoot $env:GITHUB_WORKSPACE -Repository $env:GITHUB_REPOSITORY `
            -Commit $env:GITHUB_SHA -OutFile $map
          New-Item -ItemType Directory -Force $pub | Out-Null
          "AM_SOURCELINK=$map"  >> $env:GITHUB_ENV
          "AM_PUBLIC_PDBS=$pub" >> $env:GITHUB_ENV

      - name: Build CascadiaPackage (x64 Release)
        shell: pwsh
        run: |
          msbuild OpenConsole.slnx /m `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:WindowsTerminalBranding=Dev `
            /p:AppxPackageSigningEnabled=false `
            "/p:AgentmasterSourceLinkFile=$env:AM_SOURCELINK" `
            "/p:AgentmasterPublicPdbDir=$env:AM_PUBLIC_PDBS" `
            /p:AppxSymbolPackageEnabled=false `
            /t:Terminal\CascadiaPackage `
            /bl:msbuild-ci.binlog

      # Agentmaster: the release's symbol checks, without the zips. Fails when a binary we build lacks its full PDB
      # (or that PDB lacks the Source Link map or the srcsrv stream naming this commit), or lacks its public PDB.
      - name: Check the release symbols
        shell: pwsh
        run: |
          $layout = 'src\cascadia\CascadiaPackage\bin\x64\Release'
          .\build\scripts\Index-Pdbs.ps1 -SearchDir $layout -SourceRoot $env:GITHUB_WORKSPACE -CommitId $env:GITHUB_SHA `
            -Organization $env:GITHUB_REPOSITORY_OWNER -Repo "${{ github.event.repository.name }}" *> index-pdbs-ci.log
          .\tools\Export-AgentmasterSymbols.ps1 -BinaryFolder $layout -PdbSearchPath $layout `
            -RequireUnder $env:GITHUB_WORKSPACE -RequireSourceLink $env:GITHUB_SHA -RequireSourceServer
          .\tools\Export-AgentmasterSymbols.ps1 -BinaryFolder $layout -PdbSearchPath $env:AM_PUBLIC_PDBS `
            -RequireUnder $env:GITHUB_WORKSPACE

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: binlog-ci
          # + the srcsrv indexer's log (Agentmaster), for a failed symbols check.
          path: |
            msbuild-ci.binlog
            index-pdbs-ci.log
          if-no-files-found: warn
