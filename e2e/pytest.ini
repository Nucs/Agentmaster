[pytest]
# The end-to-end suite runs in the Windows test desktop (guest/run-suite.cmd); the mock's own unit tests run
# anywhere: `python -m pytest mockllm/tests`.
testpaths = suites
pythonpath = .
# The suite's source is copied to the guest's own disk before a run; the cache provider stays off so a run
# never depends on a writable source folder.
addopts = -p no:cacheprovider -ra --strict-markers
markers =
    flow(id): the flow of doc/agentmaster/flows/ this test proves (e.g. "MGR-02")
    p0: a P0 flow (a release gate)
    p1: a P1 flow
    p2: a P2 flow
    known_defect(id): a behavior that is wrong today; the test asserts the CURRENT (wrong) behavior and is
        expected to fail once the defect is fixed (flows/README.md "Known defects")
    slow: takes more than a minute
