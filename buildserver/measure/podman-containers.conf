# podman settings for the build server's test distro (bs-measure), installed as /etc/containers/containers.conf.
# The distro has no systemd and WSL 2.3.24 mounts cgroups in hybrid mode (every controller on cgroup v1), so podman
# must manage cgroups itself (cgroupfs) and log events to a file. Containers get their own network namespace through
# pasta, so nothing here adds a bridge or firewall rule to the network namespace WSL shares with Docker Desktop.
[containers]
netns = "pasta"

[engine]
cgroup_manager = "cgroupfs"
events_logger = "file"
runtime = "crun"
