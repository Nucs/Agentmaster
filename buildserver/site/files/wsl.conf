# /etc/wsl.conf of the build server's site distro (`buildserver`), installed by buildserver/site/sitectl.py.
#
# The distro holds fastrund, the coordinator and the Windows VMs of this PC's site (buildserver/DESIGN.md §5.2). It is
# entered only by scripts as root, so the defaults that help a person (the Windows PATH, a default user) are turned off,
# and everything that the site relies on is spelled out here rather than left to WSL's defaults.

[user]
# Every caller runs as root: podman (rootful), fastrund and /dev/kvm need it, and no person logs in here.
default = root

[automount]
# The Windows drives stay mounted under /mnt: imported artifacts (a hand-built portable zip, a git bundle) are read
# from there once, then copied onto the distro's own disk (a bind of a Windows folder is 13-43x slower, DESIGN.md §16.6).
enabled = true
root = /mnt/
options = "metadata"

[interop]
# Windows programs stay callable (wsl.exe's own plumbing needs interop), but the Windows PATH is NOT appended: a slot's
# tools must come from the distro, never from whatever the PC's PATH happens to hold.
enabled = true
appendWindowsPath = false

[network]
# WSL writes resolv.conf from Windows' DNS; the hostname names the site in logs and in fastrund's node status.
generateResolvConf = true
hostname = buildserver
