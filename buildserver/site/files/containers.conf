# /etc/containers/containers.conf of the build server's site distro, installed by buildserver/site/sitectl.py.
#
# The distro has no systemd, and WSL 2.3.24 mounts every cgroup controller on cgroup v1 (hybrid mode), so podman must
# manage cgroups itself (cgroupfs) and log its events to a file. Every container gets a network namespace of its own
# through slirp4netns (rootful podman has no pasta: "pasta networking is only supported for rootless mode", measured
# 2026-10-25), so nothing the site runs adds a bridge or a firewall rule to the ONE network namespace that every WSL
# distro shares with Docker Desktop. A container that must listen where Windows can reach it (fastrund's API, the
# coordinator) asks for `--network host` explicitly.

[containers]
netns = "slirp4netns"

[engine]
cgroup_manager = "cgroupfs"
events_logger = "file"
runtime = "crun"
