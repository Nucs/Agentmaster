# /etc/containers/storage.conf of CT 803, installed by buildserver/site/worker.py `provision`.
#
# podman's images and containers live on drive 2 with the rest of the site (/srv/buildserver is drive 2's
# /mnt/drive2/data/buildserver), never on the 8 GiB root file system on drive 1: dockur's image alone is 0.6 GB, and each
# slot's container writes its logs and its QEMU state there. The kernel's overlay driver works on drive 2's ext4.

[storage]
driver = "overlay"
runroot = "/run/containers/storage"
graphroot = "/srv/buildserver/containers/storage"
