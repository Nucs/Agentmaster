# /etc/containers/containers.conf of CT 803, the build server's site on the worker machine, installed by
# buildserver/site/worker.py `provision`.
#
# The container runs OpenRC, not systemd, so podman manages cgroups itself (cgroupfs, on cgroup v2 here: the delegation
# /etc/local.d/amb-cgroups.start sets up) and logs its events to a file. Every slot gets a network namespace of its own
# through slirp4netns, the same as on homepc's site: a slot reaches the coordinator at 10.0.2.2 (the container's own
# loopback, allow_host_loopback) and nothing the site runs adds a bridge or a firewall rule to the container.

[containers]
netns = "slirp4netns"

[engine]
cgroup_manager = "cgroupfs"
events_logger = "file"
runtime = "crun"
